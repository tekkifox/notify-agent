name: notify-agent

services:
  agent:
    build:
      context: .
      args:
        OPENCODE_VERSION: "2.2.1"
        SUPERCRONIC_VERSION: "0.2.51"
    image: notify-agent:2.2.1
    container_name: notify-agent

    # With no arguments this dispatcher runs supercronic and, when an inbound
    # channel is configured, the Discord listener as independent children. It
    # also keeps `docker compose run agent <command>` working for auth, manual
    # sends, and debugging.
    entrypoint: ["/app/scripts/entrypoint.sh"]

    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s

    # Secrets only, never baked into the image. Copy stack.env.example to
    # stack.env and chmod 600. `required: false` keeps `docker compose config`
    # valid on a fresh checkout; delivery fails loudly if it is missing.
    env_file:
      - path: stack.env
        required: false

    environment:
      HOME: /home/agent
      OPENCODE_CONFIG: /app/opencode.json
      # The image sets this too. Explicit here so the only config source is the
      # pinned /app/opencode.json, never a file discovered from the working
      # directory.
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      XDG_DATA_HOME: /home/agent/.local/share
      XDG_CONFIG_HOME: /home/agent/.config
      XDG_CACHE_HOME: /home/agent/.cache
      XDG_STATE_HOME: /home/agent/.local/state
      # In-container path of the read-only Oracle wallet mount below. The MCP
      # server reads it from this variable; no wallet material is in the image.
      ORACLE_WALLET_DIR: /wallet

    # Root filesystem is immutable. Only the named volume and these tmpfs
    # mounts are writable. OpenCode needs home/cache/state/tmp paths.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /home/agent/.config:rw,nosuid,nodev,size=8m,mode=0700,uid=10001,gid=10001
      - /home/agent/.cache:rw,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
      - /home/agent/.local/state:rw,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /home/agent/.opencode:rw,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001

    # Durable auth + sessions. This is the only persistent writable state.
    # The schedule file comes from the host so schedules can be edited without
    # rebuilding the image. The image's own /app/crontab is the default, which
    # keeps a fresh checkout working; point SCHEDULES_FILE elsewhere to
    # override it. Read-only: the container never writes schedules.
    volumes:
      - opencode-data:/home/agent/.local/share/opencode
      # Oracle wallet, mounted read-only at runtime. Wallet contents are never
      # baked into the public image. Set ORACLE_WALLET_HOST_DIR to the host
      # directory that holds tnsnames.ora, ewallet.pem and sqlnet.ora (default
      # ./oracle-wallet, which is gitignored). In Portainer, either define the
      # same stack environment variable or replace the left side with the
      # absolute host path. The container path must stay /wallet, matching
      # ORACLE_WALLET_DIR.
      - ${ORACLE_WALLET_HOST_DIR:-./oracle-wallet}:/wallet:ro
      - ${SCHEDULES_FILE:-./crontab}:/app/crontab:ro

    # No ports: outbound only. No Docker socket, no host /etc or /home,
    # no privileged mode.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  opencode-data:
