name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# A new push to a pull request (or a non-main ref) cancels its previous run.
# Runs on main are never cancelled, so an in-progress deploy finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tekkifox/notify-agent

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The suites are self-contained: they start their own fake `opencode` and
      # stub MCP servers, and skip or fail by name when a tool is missing.
      - name: Check test prerequisites
        run: |
          set -eu
          missing=0
          for bin in python3 jq curl openssl flock timeout; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "::error::${bin} is required by the test suites but is not on PATH"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install the chart renderer dependency
        run: python3 -m pip install --disable-pip-version-check --break-system-packages "Pillow==11.3.0"

      - name: Run the Python suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run the shell suites
        run: |
          set -eu
          for suite in tests/run-prompt-*.sh tests/notify-targets.sh; do
            echo "::group::${suite}"
            sh "$suite"
            echo "::endgroup::"
          done

  # The image's only consumer is `photos`, which is an aarch64 host, so only
  # linux/arm64 is built. The build runs on GitHub's hosted arm64 runner, so it
  # is native: no QEMU and no `platforms:` override are needed.
  build:
    name: Build linux/arm64
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the chart renderer dependency
        run: python3 -m pip install --disable-pip-version-check --break-system-packages "Pillow==11.3.0"

      - name: Test the read-only SQL guard
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # Push by digest only. The merge job publishes the tagged manifest.
      - name: Build and push linux/arm64 by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=notify-agent-arm64
          cache-to: type=gha,mode=max,scope=notify-agent-arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/digest
          retention-days: 1

  merge:
    name: Publish arm64 manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download linux/arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: /tmp/digests/arm64

      - name: Verify the digest exists
        run: |
          test -s /tmp/digests/arm64/digest

      # Tags are applied here, once, to the pushed image.
      - name: Publish arm64 manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/arm64/digest)"

  # The fleet's stacks are Ansible-managed files on disk. A GitHub-hosted
  # runner joins the tailnet and asks the deploy gateway to pull and recreate
  # the stack; the gateway validates the host and stacks, refuses a stack the
  # host does not declare, and prints the image id afterwards.
  #
  # The runner holds only a gateway key whose public half is enrolled for CI in
  # the gateway's authorized keys, and the gateway's pinned host key, so no
  # deploy key or root access on the deploy seat is needed. The gateway address
  # is public: it is a tailnet name, reachable only from inside the tailnet.
  deploy:
    name: Deploy notify-agent
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-notify-agent-${{ github.run_id }}

      - name: Install the gateway key and its pinned host key
        env:
          GATEWAY_KEY: ${{ secrets.DEPLOY_GATEWAY_SSH_KEY }}
          GATEWAY_HOST_KEY: ${{ secrets.DEPLOY_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$GATEWAY_KEY" > "$HOME/.ssh/gateway"
          chmod 0600 "$HOME/.ssh/gateway"
          printf '%s\n' "$GATEWAY_HOST_KEY" > "$HOME/.ssh/gateway_known_hosts"
          chmod 0600 "$HOME/.ssh/gateway_known_hosts"

      - name: Ask the deploy gateway to deploy
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gateway" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/gateway_known_hosts" \
            -o ConnectTimeout=30 \
            deploy-hop@deploy-gateway.tail81cbd2.ts.net \
            "deploy photos photos-notify-agent"
