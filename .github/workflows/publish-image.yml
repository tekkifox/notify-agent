name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# A new push to a pull request (or a non-main ref) cancels its previous run.
# Runs on main are never cancelled, so an in-progress deploy finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tekkifox/notify-agent

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The suites are self-contained: they start their own fake `opencode` and
      # stub MCP servers, and skip or fail by name when a tool is missing.
      - name: Check test prerequisites
        run: |
          set -eu
          missing=0
          for bin in python3 jq curl openssl flock timeout; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "::error::${bin} is required by the test suites but is not on PATH"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install the chart renderer dependency
        run: python3 -m pip install --disable-pip-version-check --break-system-packages "Pillow==11.3.0"

      - name: Run the Python suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run the shell suites
        run: |
          set -eu
          for suite in tests/run-prompt-*.sh tests/notify-targets.sh; do
            echo "::group::${suite}"
            sh "$suite"
            echo "::endgroup::"
          done

  build:
    name: Build linux/${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: no QEMU.
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the chart renderer dependency
        run: python3 -m pip install --disable-pip-version-check --break-system-packages "Pillow==11.3.0"

      - name: Test the read-only SQL guard
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # Push by digest only. The merge job publishes the tagged manifest.
      - name: Build and push linux/${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=notify-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=notify-agent-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/digest
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download linux/amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: /tmp/digests/amd64

      - name: Download linux/arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: /tmp/digests/arm64

      - name: Verify both digests exist
        run: |
          test -s /tmp/digests/amd64/digest
          test -s /tmp/digests/arm64/digest

      # Tags are applied here, once, to the combined manifest.
      - name: Publish multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/amd64/digest)" \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/arm64/digest)"

  # The fleet's stacks are Ansible-managed files on disk. This job only joins
  # the tailnet and asks the deploy seat on mgmt to pull and recreate the stack;
  # the seat validates the host and stacks, refuses a stack the host does not
  # declare, and prints the image id afterwards.
  #
  # This is deliberately self-contained rather than a call to the fleet's
  # reusable deploy-stack.yml: that workflow lives in the private
  # tekkifox/infrastructure-as-code repository, and GitHub does not let a public
  # repository call a reusable workflow in a private one. The duplicated lines
  # here are only transport, and the price of this repository being public.
  # The seat address is a repo secret (DEPLOY_SEAT_HOST) so no real hostname is
  # published here.
  deploy:
    name: Deploy notify-agent
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-notify-agent-${{ github.run_id }}

      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: photos
          TARGET_STACKS: photos-notify-agent
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 0600 "$HOME/.ssh/deploy"
          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
