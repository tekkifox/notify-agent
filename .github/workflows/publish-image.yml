name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tekkifox/notify-agent

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: no QEMU.
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # Push by digest only. The merge job publishes the tagged manifest.
      - name: Build and push linux/${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=notify-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=notify-agent-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/digest
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download linux/amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: /tmp/digests/amd64

      - name: Download linux/arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: /tmp/digests/arm64

      - name: Verify both digests exist
        run: |
          test -s /tmp/digests/amd64/digest
          test -s /tmp/digests/arm64/digest

      # Tags are applied here, once, to the combined manifest.
      - name: Publish multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/amd64/digest)" \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/arm64/digest)"

      - name: Trigger Portainer redeploy
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "::warning::Image published, but PORTAINER_WEBHOOK_URL is not set; no Portainer redeploy was triggered."
            exit 0
          fi
          # The URL is a secret: never print it, only the outcome.
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$PORTAINER_WEBHOOK_URL"
          echo "Portainer redeploy triggered"
