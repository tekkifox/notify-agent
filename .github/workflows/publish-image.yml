name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# A new push to a pull request (or a non-main ref) cancels its previous run.
# Runs on main are never cancelled, so an in-progress Portainer deploy finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tekkifox/notify-agent

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The suites are self-contained: they start their own fake `opencode` and
      # stub MCP servers, and skip or fail by name when a tool is missing.
      - name: Check test prerequisites
        run: |
          set -eu
          missing=0
          for bin in python3 jq curl openssl flock timeout; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "::error::${bin} is required by the test suites but is not on PATH"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run the Python suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run the shell suites
        run: |
          set -eu
          for suite in tests/run-prompt-*.sh tests/notify-targets.sh; do
            echo "::group::${suite}"
            sh "$suite"
            echo "::endgroup::"
          done

  build:
    name: Build linux/${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: no QEMU.
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test the read-only SQL guard
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # Push by digest only. The merge job publishes the tagged manifest.
      - name: Build and push linux/${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=notify-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=notify-agent-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/digest
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download linux/amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: /tmp/digests/amd64

      - name: Download linux/arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: /tmp/digests/arm64

      - name: Verify both digests exist
        run: |
          test -s /tmp/digests/amd64/digest
          test -s /tmp/digests/arm64/digest

      # Tags are applied here, once, to the combined manifest.
      - name: Publish multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/amd64/digest)" \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/arm64/digest)"

  deploy:
    name: Redeploy Portainer stack
    runs-on: ubuntu-latest
    needs:
      - merge
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Portainer lives on the tailnet and answers on a MagicDNS name with a
      # self-signed certificate, so the hosted runner joins the tailnet first.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --hostname=gh-notify-agent-${{ github.run_id }}

      - name: Redeploy stack via Portainer API
        shell: bash
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail

          stack_name="notify-agent"

          # Stack and endpoint ids change when a stack is re-created, so discover
          # them by name instead of hardcoding them.
          list_response=$(curl -k -sS -w "\n%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks")
          list_status=$(printf '%s\n' "$list_response" | tail -n 1)
          list_body=$(printf '%s\n' "$list_response" | sed '$d')

          if [ "$list_status" -lt 200 ] || [ "$list_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks failed with HTTP status ${list_status}"
            printf '%s\n' "$list_body"
            exit 1
          fi

          stack_id=$(printf '%s\n' "$list_body" | \
            jq -r --arg name "$stack_name" 'first(.[] | select(.Name == $name) | .Id) // empty')
          endpoint_id=$(printf '%s\n' "$list_body" | \
            jq -r --arg name "$stack_name" 'first(.[] | select(.Name == $name) | .EndpointId) // empty')

          if [ -z "$stack_id" ] || [ -z "$endpoint_id" ]; then
            echo "Portainer stack '${stack_name}' not found in GET /api/stacks response"
            printf '%s\n' "$list_body"
            exit 1
          fi

          echo "Discovered Portainer stack '${stack_name}' (id=${stack_id}, endpointId=${endpoint_id})"

          # Read the current stack to preserve its Env array (never send an empty Env).
          get_response=$(curl -k -sS -w "\n%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/${stack_id}")
          get_status=$(printf '%s\n' "$get_response" | tail -n 1)
          get_body=$(printf '%s\n' "$get_response" | sed '$d')

          if [ "$get_status" -lt 200 ] || [ "$get_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks/${stack_id} failed with HTTP status ${get_status}"
            printf '%s\n' "$get_body"
            exit 1
          fi

          env_array=$(printf '%s\n' "$get_body" | jq '.Env')

          # Build the request body with jq; compose.deploy.yaml contains newlines/quotes/${...}.
          body=$(jq -n \
            --rawfile compose compose.deploy.yaml \
            --argjson env "$env_array" \
            '{StackFileContent: $compose, Env: $env, PullImage: true}')

          put_response=$(curl -k -sS -w "\n%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$body")
          put_status=$(printf '%s\n' "$put_response" | tail -n 1)
          put_body=$(printf '%s\n' "$put_response" | sed '$d')

          if [ "$put_status" -lt 200 ] || [ "$put_status" -ge 300 ]; then
            echo "Portainer PUT /api/stacks/${stack_id} failed with HTTP status ${put_status}"
            printf '%s\n' "$put_body"
            exit 1
          fi

          echo "Portainer stack redeployed"
