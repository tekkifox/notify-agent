name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tekkifox/notify-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # linux/amd64 only: the deployment host is x86_64, so no QEMU and no arm64 build.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Trigger Portainer redeploy
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "::warning::Image published, but PORTAINER_WEBHOOK_URL is not set; no Portainer redeploy was triggered."
            exit 0
          fi
          # The URL is a secret: never print it, only the outcome.
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$PORTAINER_WEBHOOK_URL"
          echo "Portainer redeploy triggered"
